<VirtualHost *:8083>
    ServerName learningplex.gsfcuniversity.in

    DocumentRoot /var/www/html/GuidePLex

    <Directory /var/www/html/GuidePLex>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    <Location /server-status>
        SetHandler server-status
        Require local
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/guideplex8087_error.log
    CustomLog ${APACHE_LOG_DIR}/guideplex8087_access.log combined
</VirtualHost>
