<VirtualHost *:8089>

    ServerName 10.205.19.6

    DocumentRoot /var/www/html/Guideplex_lb2

    <Directory /var/www/html/Guideplex_lb2>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    <Location /server-status>
        SetHandler server-status
        Require local
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/guideplex8089_error.log
    CustomLog ${APACHE_LOG_DIR}/guideplex8089_access.log combined

</VirtualHost>
